name: Submit to Web Store
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm package
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: chrome-extension
          path: dist/mermaid-previewer-chrome.zip
          if-no-files-found: error

  submit:
    runs-on: ubuntu-latest
    needs: build
    concurrency: chrome-web-store
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: chrome-extension
      - name: Read existing Chrome Web Store credentials
        id: keys
        env:
          SUBMIT_KEYS: ${{ secrets.SUBMIT_KEYS }}
        run: |
          for field in clientId clientSecret refreshToken; do
            value=$(jq -er --arg field "$field" '.chrome[$field] | strings | select(length > 0)' <<< "$SUBMIT_KEYS")
            echo "::add-mask::$value"
            echo "$field=$value" >> "$GITHUB_OUTPUT"
          done
      - uses: hamzahamidi/publish-to-chrome-web-store@c8919147f8de0d6f1129bec36345e4a9aa638af9 # v1.2.2
        with:
          client-id: ${{ steps.keys.outputs.clientId }}
          client-secret: ${{ steps.keys.outputs.clientSecret }}
          refresh-token: ${{ steps.keys.outputs.refreshToken }}
          publisher-id: ${{ vars.CWS_PUBLISHER_ID }}
          item-id: oidjnlhbegipkcklbdfnbkikplpghfdl
          zip: mermaid-previewer-chrome.zip
