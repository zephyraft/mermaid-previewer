name: Release
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm package
      - run: mv dist/mermaid-previewer-chrome.zip mermaid-previewer.zip
      - uses: softprops/action-gh-release@v3.0.4
        with:
          draft: true
          files: mermaid-previewer.zip
